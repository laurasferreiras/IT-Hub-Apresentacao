<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0E1A">
<title>IT Hub · Um dia no futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== ESTILOS (identidade visual do IT Hub) ===================== */
:root{
  --bg:#0C0E1A; --card:#151A2E; --card-2:#1C2240; --line:#2A2E48; --edge:rgba(255,255,255,.07);
  --ink:#F4F5FA; --soft:#9CA1BF;
  --cyan:#00E0FA; --vio:#7C4DFF; --lav:#A98BFF; --mag:#FF3EA5; --blue:#4F7CFF; --amber:#FFB547; --lime:#3DDC97; --bad:#FF5C7A;
  --grad:linear-gradient(90deg,#7C4DFF,#FF3EA5);
  --grad-tl:linear-gradient(90deg,#00E0FA,#7C4DFF 60%,#FF3EA5);
  --focus:#00E0FA;
  --font:"Poppins","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* O visual do IT Hub é escuro nos dois modos do sistema. */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;background-color:var(--bg);
  background-image:radial-gradient(ellipse 80% 70% at 100% 0%,rgba(66,33,150,.6),transparent 62%),linear-gradient(160deg,#0C0E1A 45%,#120E26);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3{font-weight:800;line-height:1.08;margin:0;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
.soft{color:var(--soft)}
.neon{text-shadow:none}
.glass{background:var(--card);border:1px solid var(--edge);border-radius:14px}
.notice{background:var(--card-2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--soft)}
.icon{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.word{display:inline-block;padding:5px 16px;border-radius:999px;background:var(--c);color:#0C0E1A;font-weight:700;letter-spacing:.04em}
.kick{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sc,var(--cyan))}
.shakeA{animation:shakeA .45s}
.shakeB{animation:shakeB .45s}
@keyframes shakeA{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes shakeB{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Logo e Lia */
.logo{display:block}
.lia-svg{width:100%;height:100%;display:block;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4%)}}

/* Linha do dia (rodapé dos slides e topo do celular) */
.tl{--u:1cqw;position:relative;height:calc(var(--u) * 9.4);margin:0 .4%}
.team .tl{--u:5px;height:62px}
.team .tl .lbl{font-size:10.5px;top:38px}
.tl .track,.tl .tlfill{position:absolute;top:calc(var(--u) * 6);left:0;height:calc(var(--u) * .3);border-radius:99px}
.tl .track{right:0;background:var(--line)}
.tl .tlfill{background:var(--grad-tl);transition:width .9s cubic-bezier(.4,0,.2,1)}
.tl .dot{position:absolute;top:calc(var(--u) * 6.15);transform:translate(-50%,-50%);width:calc(var(--u) * 1.7);height:calc(var(--u) * 1.7);border-radius:50%;background:#11142A;border:calc(var(--u) * .2) solid #3A3E5C}
.tl .dot.done{width:calc(var(--u) * 2.5);height:calc(var(--u) * 2.5);border:0;background:linear-gradient(135deg,#00E0FA,#7C4DFF);display:grid;place-items:center;font-weight:700;font-size:calc(var(--u) * 1.3);color:#fff}
.tl .dot.cur{border:calc(var(--u) * .34) solid var(--mag);width:calc(var(--u) * 1.9);height:calc(var(--u) * 1.9)}
.tl .lbl{position:absolute;top:calc(var(--u) * 7.5);transform:translateX(-50%);font-size:calc(var(--u) * 1.45);color:var(--soft);white-space:nowrap}
.tl .lbl.cur{color:#fff;font-weight:700}
.tl .star{position:absolute;top:calc(var(--u) * 6.15);transform:translate(-50%,-50%);width:calc(var(--u) * 2.3);height:calc(var(--u) * 2.3);color:var(--mag)}
.tl .lia{position:absolute;top:0;transform:translateX(-50%);width:calc(var(--u) * 3.8);height:calc(var(--u) * 6);transition:left .9s cubic-bezier(.4,0,.2,1)}

/* ---------- Celular e jogos ---------- */
.team{position:relative;overflow:hidden;max-width:600px;margin:0 auto;min-height:100%;padding:14px 14px 28px;display:grid;gap:12px;align-content:start}
.team-head{display:grid;gap:4px}
.team-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.team-brand svg{width:26px;height:22px}
.brand{font-weight:700;font-size:16px}
.card{padding:16px;display:grid;gap:12px}
.card h2{font-size:23px}
.tag{font-size:12px;color:var(--soft);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.big-msg{text-align:center;display:grid;gap:10px;justify-items:center;padding:18px 8px}
.big-msg h2{font-size:26px}
.timer-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tbadge{font-weight:800;font-size:22px;color:var(--cyan);font-variant-numeric:tabular-nums}
.steps-dots{display:flex;gap:6px}
.steps-dots i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.steps-dots i.on{background:var(--grad)}
.steps-dots i.done{background:var(--cyan)}
.ph-title{font-weight:700;font-size:19px;line-height:1.2}
.ph-hint{font-size:14px;color:var(--soft)}
.msg{font-size:14px;color:var(--amber);min-height:1.2em;text-align:center;font-weight:500}
.count{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:60px;background:var(--grad)}
.zoom{animation:zoom .9s cubic-bezier(.2,.8,.2,1)}
@keyframes zoom{0%{transform:scale(1.7);opacity:0}35%{transform:scale(1);opacity:1}}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--grad);color:#fff;font-weight:700;font-size:16px}
.btn:disabled{opacity:.35}
.btn-ghost{background:none;border:0;color:var(--soft);text-decoration:underline;padding:4px 0;justify-self:center;font-size:14px}
.fragcard{display:grid;gap:8px;justify-items:center;padding:20px;border-radius:16px;background:var(--card);border:2px solid var(--c)}
.fragcard .dig{font-weight:800;font-size:64px;line-height:1;color:var(--c)}
.wave{display:flex;gap:6px;align-items:center;height:38px}
.wave i{width:6px;border-radius:3px;background:var(--grad);animation:wave 1.1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wave{0%,100%{height:10px}50%{height:36px}}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--mag);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.game{display:grid;gap:12px}

/* M1 */
.places{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-radius:14px;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.04) 22px 24px),repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.04) 22px 24px),var(--card)}
.place{border:2px solid var(--c);border-radius:12px;padding:14px 8px;background:color-mix(in srgb,var(--c) 14%,var(--card));font-weight:600;display:grid;justify-items:center;gap:4px;font-size:14px}
.place .icon{font-size:24px;color:var(--c)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px;border-radius:14px;background:var(--card)}
.cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:#11142A;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--soft);padding:0;line-height:1.1;text-align:center}
.cell.adj{border-color:var(--cyan)}
.cell.block{background:repeating-linear-gradient(45deg,rgba(255,92,122,.55) 0 6px,#2A1020 6px 12px);border-color:var(--bad);color:#fff}
.cell.water{background:repeating-linear-gradient(0deg,rgba(79,124,255,.6) 0 5px,#141A40 5px 10px);border-color:var(--blue);color:#fff}
.cell.dest{border:2px solid var(--mag);background:rgba(255,62,165,.2);color:#fff}
.cell.home{color:#fff}
.cell.trail{background:rgba(0,224,250,.14)}
.lia-dot{width:82%;height:82%;display:block}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:1px solid var(--edge);border-radius:12px;background:var(--card);padding:12px 4px;display:grid;justify-items:center;gap:4px;font-size:13px}
.item .em{font-size:28px;line-height:1}
.item.got{border-color:var(--cyan);background:rgba(0,224,250,.12)}
.item.no{opacity:.35;text-decoration:line-through}
/* M2 */
.arena{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px;border-radius:14px;background:var(--card);max-width:290px;width:100%;justify-self:center}
.acell{aspect-ratio:1;border-radius:8px;background:#11142A;border:1px solid var(--line);display:grid;place-items:center;position:relative}
.bat{width:46%;height:60%;border:2px solid var(--lime);border-radius:4px;background:linear-gradient(0deg,var(--lime) 60%,transparent 60%)}
.robot{width:74%;height:74%;transition:transform .3s;color:var(--cyan)}
.robot.crash{color:var(--bad)}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border-radius:12px;border:1px dashed var(--line);background:#11142A;align-items:center}
.blk{border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;color:#0C0E1A;background:var(--c)}
.blk.now{outline:3px solid #fff}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.palette button{border:0;border-radius:12px;padding:12px 4px;background:var(--c);color:#0C0E1A;font-weight:700;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:8px}
/* M3 */
.oldphone{border-radius:24px;padding:10px;background:var(--grad);max-width:280px;width:100%;justify-self:center}
.oldscreen{border-radius:16px;background:#F3F2F8;color:#1B1440;padding:14px;min-height:150px;display:grid;gap:8px;align-content:center;transition:background .3s}
.oldscreen.dim{background:#57566A}
.note{transition:font-size .3s,color .3s;font-size:9px;color:#C7C6D2;line-height:1.25;font-weight:700}
.note.big{font-size:20px}
.note.hc{color:#120A30}
.clutter{display:grid;gap:3px}
.clutter i{display:block;height:5px;border-radius:2px;background:#B9B6D0}
.voice{display:flex;gap:6px;align-items:center;font-size:13px;color:#5A2DCF;font-weight:700}
.grandpa{display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px}
.face{font-size:32px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tools button{border:1px solid var(--edge);border-radius:12px;padding:10px 4px;background:var(--card);font-size:12px;line-height:1.15;display:grid;justify-items:center;gap:4px;min-height:70px}
.tools button .icon{font-size:22px;color:var(--mag)}
.tools button[aria-pressed="true"]{border-color:var(--mag);background:rgba(255,62,165,.16)}
.totem{border-radius:16px;background:#E9E8F2;color:#1B1440;padding:12px;display:grid;gap:8px;max-width:320px;width:100%;justify-self:center;border:3px solid #5A2DCF}
.spot{border:2px dashed transparent;border-radius:10px;background:transparent;padding:6px;text-align:left;color:inherit}
.spot.found{border-color:var(--bad);background:rgba(255,92,122,.15)}
.spot .light{color:#C9C8D4;font-weight:700}
.vid{height:70px;border-radius:8px;background:#1B1440;display:grid;place-items:center;color:#fff;font-size:22px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#5A2DCF;color:#fff;display:grid;place-items:center;font-size:20px}
.buybtn{background:#5A2DCF;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700;text-align:center;display:block}
/* M4 */
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.char{border:2px solid var(--c);border-radius:14px;padding:10px 4px;background:color-mix(in srgb,var(--c) 12%,var(--card));display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700}
.char .icon{font-size:28px;color:var(--c)}
.char[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 35%,var(--card));transform:translateY(-3px)}
.char.used{opacity:.3}
.stations{display:grid;gap:8px}
.station{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--edge);border-radius:12px;padding:12px;background:var(--card);text-align:left;font-weight:600}
.station .slot{min-width:40px;height:40px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center}
.station .slot .icon{font-size:24px}
.station.filled{border-color:var(--cyan)}
.alert{border-radius:14px;padding:12px;background:var(--grad);text-align:center;font-weight:700;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.8}}
.choices{display:grid;gap:8px}
.choices button{border:1px solid var(--edge);border-radius:12px;padding:14px;background:var(--card);text-align:left;font-weight:600}
/* M5 */
.vault{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.wheel{aspect-ratio:.8;border-radius:12px;border:2px solid var(--c);display:grid;place-items:center;font-weight:800;font-size:34px;color:var(--c);background:#11142A}
.wheel.empty{border-style:dashed;color:rgba(255,255,255,.25)}
.vault.open{border-color:var(--mag)}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv button{border:2px solid var(--c);border-radius:12px;padding:10px 6px;background:var(--card);display:grid;justify-items:center;gap:2px;font-weight:700;letter-spacing:.05em;color:var(--c);font-size:13px}
.inv button b{font-size:26px;color:#fff}
.inv button.used{opacity:.25}

/* ---------- Slides (estilo IT Hub) ---------- */
.wrap{container-type:inline-size;width:100%}
.slide{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:1.4cqw;padding:4.4cqw 6.6cqw 1.6cqw;font-size:max(11px,1.75cqw);
  background:radial-gradient(ellipse 75% 85% at 100% 0%,rgba(66,33,150,.65),transparent 62%),linear-gradient(160deg,#0C0E1A 45%,#110D24)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw;position:relative;z-index:1}
.slide .kick{font-size:1.35cqw;display:flex;gap:1cqw;align-items:center;flex-wrap:wrap}
.top-r{display:flex;gap:1cqw;align-items:center}
.logo-s{width:5.2cqw;height:auto}
.sndbtn{border:1px solid var(--edge);background:var(--card);border-radius:99px;padding:.3cqw 1cqw;font-size:1.1cqw;color:var(--soft)}
.main{position:relative;z-index:1;display:grid;align-content:start;gap:1.4cqw;min-height:0}
.slide h1{font-size:5.4cqw}
.slide h2{font-size:3.6cqw;font-weight:700}
.pista-tag{display:inline-flex;align-items:center;background:var(--amber);color:#1A1200;border-radius:99px;padding:.2cqw 1cqw;font-size:1.1cqw;letter-spacing:.08em}
.scenebox{background:var(--card);border:1px solid var(--edge);border-radius:1cqw;padding:2cqw 2.2cqw;max-width:62cqw}
.scenebox .kick{font-size:1.3cqw;margin-bottom:.8cqw}
.scenebox p{font-size:2.25cqw;line-height:1.4}
.cards4{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.4cqw}
.cards4 > div{background:var(--card);border:1px solid var(--edge);border-radius:1cqw;padding:2cqw 1.7cqw;min-height:11.5cqw;display:grid;align-content:start;gap:1.5cqw}
.cards4 .icon{font-size:2.5cqw;color:var(--sc)}
.cards4 b{font-weight:600;font-size:1.85cqw;line-height:1.22}
.cards4 small{font-size:1.3cqw;color:var(--soft);line-height:1.35}
.cards4.pista > div{border-color:var(--amber)}
.cards4.pista .icon{color:var(--amber)}
.banner{background:var(--grad);border-radius:1cqw;padding:1.6cqw 2.2cqw;font-weight:600;font-size:2cqw;line-height:1.35}
.cover{display:grid;gap:1.2cqw;align-content:center}
.cover-logo{display:flex;align-items:flex-end;gap:1.6cqw;margin-bottom:1.4cqw}
.cover-logo svg{width:8.4cqw;height:auto}
.cover-logo b{font-size:3.4cqw;font-weight:800;letter-spacing:.06em;line-height:1}
.cover h1{font-size:5.6cqw;max-width:20ch}
.cover .tsub{font-size:2.9cqw;font-weight:700;color:var(--cyan)}
.cover .tline{font-size:1.9cqw;color:var(--soft)}
.pills{display:flex;flex-wrap:wrap;gap:1cqw;margin-top:1.4cqw}
.pills span{border-radius:99px;padding:.6cqw 1.9cqw;font-weight:700;font-size:1.55cqw;background:var(--c);color:var(--t,#0C0E1A)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3cqw;align-items:start}
.lockcard{display:flex;gap:2cqw;align-items:center;background:var(--card);border:1px solid var(--mag);border-radius:1cqw;padding:2cqw 2.4cqw;max-width:62cqw}
.lockcard .icon{font-size:5cqw;color:var(--mag);animation:blink 1.6s infinite}
.lockcard b{font-size:2.4cqw;letter-spacing:.06em}
.qr{background:#fff;padding:1.2cqw;border-radius:1.2cqw;display:grid;gap:.8cqw;justify-items:center;justify-self:end}
.qr p{color:#1B1440;font-size:1.05cqw;word-break:break-all;max-width:20cqw;text-align:center}
#qr img,#qr canvas{width:20cqw!important;height:20cqw!important;display:block}
.qr-ph{width:20cqw;height:20cqw;display:grid;place-items:center;text-align:center;color:#4B4380;font-size:1.25cqw;border:.2cqw dashed #B7B0E8;border-radius:1cqw;padding:1.4cqw}
.mlist{display:grid;gap:1cqw}
.mrow{display:grid;grid-template-columns:3cqw minmax(0,1fr) 7cqw;gap:1.2cqw;align-items:center;background:var(--card);border:1px solid var(--edge);border-radius:1cqw;padding:1.1cqw 1.4cqw}
.mrow .n{font-weight:800;font-size:2.2cqw;color:var(--sc)}
.mrow .track{height:1cqw;border-radius:99px;background:var(--line);overflow:hidden;margin-top:.5cqw}
.mrow .fill{height:100%;background:var(--grad-tl);transition:width .6s ease}
.mrow b{font-size:1.9cqw;text-align:right}
.ring{width:12cqw;height:12cqw;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.low .fg{stroke:var(--mag)}
.ring.low span{animation:beat .5s infinite alternate}
.ring span{font-weight:800;font-size:4.2cqw;font-variant-numeric:tabular-nums}
@keyframes beat{to{transform:scale(1.12)}}
.count-big{width:18cqw;height:18cqw;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:10cqw;background:var(--grad);justify-self:center}
.big-num{font-weight:800;font-size:4.2cqw;line-height:1}
.slide .fragcard{padding:2.4cqw 3cqw;border-radius:1.4cqw;gap:1cqw;border-width:.25cqw}
.slide .fragcard .dig{font-size:11cqw}
.slide .fragcard .word{font-size:2.2cqw;padding:.5cqw 1.8cqw}
.slide .fragcard .soft{font-size:1.5cqw}
.code{display:flex;gap:1.4cqw}

function initGame(k){
  const base = { phase:1, err:0, stars:[], qno:[], done:false };
  if (k === 1) return { ...base, pos:[...M1.start], trail:['3,0'], got:[], no:[] };
  if (k === 2) return { ...base, prog:[], anim:null };
  if (k === 3) return { ...base, on:[], found:[] };
  if (k === 4) return { ...base, sel:null, placed:{} };

}
function gameOf(t, k){ return t.games[k] = t.games[k] || initGame(k); }
const kindOf = (k, g) => MISSIONS[k].kinds[g.phase - 1];
const starsOf = g => g ? g.stars.reduce((a, b) => a + b, 0) : 0;
const starPhases = k => MISSIONS[k].kinds.filter(x => x !== 'vote').length;
const MAX_STARS = [1, 2, 3, 4].reduce((a, k) => a + starPhases(k), 0);
function shake(t, msg){ const g = t.curK ? gameOf(t, t.curK) : null; if (g) g.err++; t.shakeN++; t.shakeOn = true; t.msg = msg || ''; render(); }
function simulate(start, prog, target){
  let r = { ...start }; const steps = [{ ...r }];
  for (const c of prog) {
    if (c === 'F') { r = { ...r, y:r.y + DIRS[r.d][0], x:r.x + DIRS[r.d][1] }; if (r.y < 0 || r.x < 0 || r.y >= M2.size || r.x >= M2.size) { steps.push({ ...r, crash:true }); return { steps, ok:false, why:'O Byte bateu na parede!' }; } }
    else if (c === 'G') r = { ...r, d:(r.d + 1) % 4 };
    else if (c === 'P') { const ok = r.y === target[0] && r.x === target[1]; steps.push({ ...r, pick:true }); return { steps, ok, why:ok ? '' : 'Não tem bateria aqui.' }; }
    steps.push({ ...r });
  }
  return { steps, ok:false, why:'Faltou PEGAR a bateria.' };
}
function runRobot(t, k, prog, cfg, onOk){
  const g = gameOf(t, k);
  if (g.anim) return;
  const res = simulate(cfg.start, prog, cfg.target);
  g.anim = { steps:res.steps, i:0 };
  const step = () => {
    if (!g.anim) return;
    if (g.anim.i < g.anim.steps.length - 1) { g.anim.i++; render(); setTimeout(step, 420); }
    else setTimeout(() => { g.anim = null; if (res.ok) onOk(); else { if (kindOf(k, g) === 'code') g.prog = []; t.curK = k; shake(t, res.why + ' Tente de novo.'); } }, 500);
  };
  render(); setTimeout(step, 420);
}

  const g = gameOf(t, k);
  t.curK = k; t.shakeOn = false;

  if (act === 'm0-purpose') { const i = +b.dataset.i; if (i === PURPOSE.correct) return advance(t, 5); if (!g.qno.includes(i)) g.qno.push(i); return shake(t, 'Pense em quem a tecnologia serve.'); }
  if (act === 'm0-quiz') { const i = +b.dataset.i; if (i === QUIZ[k].correct) return advance(t, k); if (!g.qno.includes(i)) g.qno.push(i); return shake(t, 'Não é essa. Lembra da palestra?'); }
  if (act === 'm1-place') { if (b.dataset.id === 'azul') return advance(t, 1); return shake(t, 'Não é aqui. Lembra da fala da Bruna?'); }
  if (act === 'm1-cell') {
    const r = +b.dataset.r, c = +b.dataset.c, key = r + ',' + c;
    if (Math.abs(g.pos[0] - r) + Math.abs(g.pos[1] - c) !== 1) return shake(t, 'Só dá para andar uma quadra por vez.');
    if (M1.blocks[key]) return shake(t, `${M1.blocks[key][1]}! Procure outro caminho.`);
    g.pos = [r, c]; if (!g.trail.includes(key)) g.trail.push(key); t.msg = '';
    if (r === M1.dest[0] && c === M1.dest[1]) return advance(t, 1);
    return render();
  }
  if (act === 'm1-item') {
    const id = b.dataset.id;
    if (M1.need.includes(id)) { if (!g.got.includes(id)) g.got.push(id); t.msg = ''; render(); if (M1.need.every(n => g.got.includes(n))) setTimeout(() => advance(t, 1), 350); return; }
    if (!g.no.includes(id)) g.no.push(id);
    return shake(t, 'Esse não estava no lembrete.');
  }
  if (act === 'm2-cmd') { if (g.prog.length < 6) g.prog.push(b.dataset.id); t.msg = ''; return render(); }
  if (act === 'm2-del') { g.prog.pop(); return render(); }
  if (act === 'm2-run') return runRobot(t, 2, g.prog, M2.p1, () => advance(t, 2));
  if (act === 'm2-run2') { const prog = g.fixed ? M2.p2.buggy.map((c, i) => i === M2.p2.wrong ? M2.p2.fix : c) : M2.p2.buggy; return runRobot(t, 2, prog, M2.p2, () => { if (g.fixed) advance(t, 2); else { t.curK = 2; shake(t, 'O Byte errou o caminho. Qual bloco está errado?'); } }); }
  if (act === 'm2-bug') {
    if (+b.dataset.i !== M2.p2.wrong) return shake(t, 'Esse bloco está certo. Procure outro.');
    g.fixed = true; t.msg = 'Corrigido! Veja o Byte executar…'; render();
    return runRobot(t, 2, M2.p2.buggy.map((c, i) => i === M2.p2.wrong ? M2.p2.fix : c), M2.p2, () => advance(t, 2));
  }
  if (act === 'm3-tool') {
    const id = b.dataset.id;
    g.on = g.on.includes(id) ? g.on.filter(x => x !== id) : [...g.on, id];
    if (M3.bad.includes(id) && g.on.includes(id)) return shake(t, id === 'info' ? 'Mais informação deixou a tela ainda mais confusa.' : 'O modo econômico escureceu tudo.');
    t.msg = '';
    if (M3.good.every(x => g.on.includes(x)) && !M3.bad.some(x => g.on.includes(x))) { render(); return setTimeout(() => advance(t, 3), 900); }
    return render();
  }
  if (act === 'm3-spot') {
    const id = b.dataset.id;
    if (!M3.barriers.includes(id)) return shake(t, 'Isso aqui está acessível.');
    if (!g.found.includes(id)) g.found.push(id); t.msg = '';
    if (g.found.length === 3) { render(); return setTimeout(() => advance(t, 3), 400); }
    return render();
  }
  if (act === 'm4-char') { g.sel = b.dataset.id; t.msg = ''; return render(); }
  if (act === 'm4-station') {
    if (!g.sel) return shake(t, 'Primeiro toque numa pessoa.');
    const st = M4.stations.find(s => s.id === b.dataset.id);
    if (st.need !== g.sel) { g.sel = null; return shake(t, 'Essa tarefa pede outra habilidade. Lembra da fala do Carlos?'); }
    g.placed[st.id] = g.sel; g.sel = null; t.msg = '';
    if (Object.keys(g.placed).length === 3) { render(); return setTimeout(() => advance(t, 4), 400); }
    return render();
  }
  if (act === 'm4-card') { if (b.dataset.id === M4.correct) return advance(t, 4); return shake(t, b.dataset.id === 'desistir' ? 'Desistir não atende ninguém.' : 'Isso ignora quem não tem internet.'); }
  if (act === 'm5-frag') {
    g.seq.push(+b.dataset.i); t.msg = '';
    if (g.seq.length === 4) { if (g.seq.join('') === '0123') { g.open = true; render(); return setTimeout(() => advance(t, 5), 1100); } g.seq = []; return shake(t, 'Código errado. A ordem é a do dia da Lia.'); }
    return render();
  }
  if (act === 'm5-clear') { g.seq = []; return render(); }
}


/* ===================== ESTADO LOCAL (localStorage) ===================== */
// P guarda tudo do participante. Só o que está em stages/games/result é salvo.
const P = { id:'eu', games:{}, stages:{}, result:null, shakeN:0, shakeOn:false, msg:'', curK:null, draft:'', codeMsg:'' };
const st = k => P.stages[k] || { status:'locked' };            // locked | playing | done
const isDone = k => st(k).status === 'done';
const playingK = () => [1, 2, 3, 4, 5].find(k => st(k).status === 'playing') || null;
const nextK = () => [1, 2, 3, 4, 5].find(k => !isDone(k)) || null;
const fmtMin = sec => sec % 60 ? `${Math.floor(sec / 60)} min ${sec % 60} s` : `${sec / 60} min`;
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function load(){
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d) { P.stages = d.stages || {}; P.games = d.games || {}; P.result = d.result || null; Object.values(P.games).forEach(g => { g.anim = null; }); }
  } catch (e) { /* sem localStorage: o app funciona só enquanto a página estiver aberta */ }
}
function save(){
  try {
    const games = {}; Object.keys(P.games).forEach(k => { const { anim, ...rest } = P.games[k]; games[k] = rest; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ stages:P.stages, games, result:P.result }));
  } catch (e) {}
}
function resetAll(){
  P.games = {}; P.stages = {}; P.result = null; P.draft = ''; P.codeMsg = ''; P.msg = ''; P.shakeOn = false;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  render();
}

/* ===================== ETAPAS E CRONÔMETRO INDIVIDUAL ===================== */
function startStage(k){
  if (isDone(k) || st(k).status === 'playing' || (k > 1 && !isDone(k - 1))) return; // não pula etapas
  const now = Date.now();
  P.stages[k] = { status:'playing', startedAt:now, endsAt:now + TEMPO_ETAPA_SEG * 1000 };
  P.games[k] = initGame(k); P.result = null; P.msg = ''; P.shakeOn = false; P.codeMsg = '';
  save(); render(); window.scrollTo(0, 0);
}
function finishStage(k, recovered){
  const s = st(k); s.status = 'done'; s.recovered = !!recovered; s.finishedAt = Date.now();
  P.stages[k] = s; P.result = k; save();
}
function canPlay(k){ const s = st(k); return s.status === 'playing' && Date.now() < s.endsAt; }
function advance(t, k){
  if (st(k).status !== 'playing') return;
  const g = gameOf(t, k);
  t.msg = ''; t.shakeOn = false;
  if (!['vote', 'vault'].includes(kindOf(k, g))) g.stars.push(g.err === 0 ? 1 : 0);
  g.err = 0; g.qno = [];
  if (g.phase >= MISSIONS[k].phases.length) { g.done = true; finishStage(k, false); } else g.phase++;
  save(); render(); if (P.result) window.scrollTo(0, 0);
}
/* Tempo esgotado: regra original — a solução é mostrada e o fragmento é recuperado. */
function tick(){
  const k = playingK();
  if (k && Date.now() >= st(k).endsAt) { const g = P.games[k]; if (g) g.anim = null; finishStage(k, true); window.scrollTo(0, 0); }
  render();
}

/* ===================== CÓDIGOS DAS ETAPAS 2 A 4 ===================== */
function tentarCodigo(v){
  const nk = nextK(), c = norm(v);
  if (!c) P.codeMsg = 'Digite o código que está no telão.';
  else {
    const hit = [2, 3, 4].find(k => norm(CODIGO_DA_ETAPA[k]) === c);
    if (!hit) P.codeMsg = 'Código incorreto. Confira o telão e tente de novo.';
    else if (hit < nk) P.codeMsg = 'Esse código é de uma etapa que você já concluiu.';
    else if (hit > nk) P.codeMsg = `Esse código é da etapa ${hit}. Conclua a etapa ${nk} primeiro.`;
    else { P.draft = ''; P.codeMsg = ''; return startStage(hit); }
  }
  render(); const el = document.getElementById('cod'); if (el) el.focus();
}

/* ===================== TELAS ===================== */
function stagePos(){ const p = playingK(); if (p) return p; if (isDone(5)) return 5; return [1, 2, 3, 4].filter(isDone).length; }
const doneCount = () => [1, 2, 3, 4].filter(isDone).length;

function codeForm(k){
  const M = MISSIONS[k];
  return `<form class="codeform" data-form="code" autocomplete="off">
    <label class="tag" for="cod">Etapa ${k} · ${M.who}: digite o código do telão</label>
    <input id="cod" name="cod" class="codeinp" value="${P.draft.replace(/"/g, '')}" maxlength="16" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="CÓDIGO">
    <button class="btn" type="submit">Liberar missão ${k}</button>
    <p class="msg" role="status">${P.codeMsg}</p></form>`;
}
function hubHTML(){
  const nk = nextK(), fresh = !P.stages[1];
  const nodes = [1, 2, 3, 4, 5].map(k => {
    const M = MISSIONS[k], s = st(k), done = s.status === 'done';
    const state = done ? 'done' : k === nk ? 'next' : 'lock';
    const label = done ? (k === 5 ? (s.recovered ? 'Código revelado' : 'Cofre aberto') : s.recovered ? 'Fragmento recuperado' : `Concluída · ${starsOf(P.games[k])}/${starPhases(k)} estrelas`)
      : state === 'next' ? (k === 1 ? 'Pronta para começar' : k === 5 ? 'Cofre liberado' : 'Aguardando o código do telão') : 'Bloqueada';
    const dig = k <= 4 && done ? `<span class="nd" style="--c:${WORDS[k - 1].c}">${WORDS[k - 1].digit}</span>` : '';
    return `<li class="node ${state}"><span class="nart">${state === 'lock' ? I.lock : missionArt(k)}</span><div><b>${k === 5 ? 'Missão final' : `Missão ${k}`}: ${M.name}</b><small>${label}</small></div>${dig}</li>`;
  }).join('');
  const frags = `<div class="fragrow" aria-label="Fragmentos conquistados">${WORDS.map((w, i) => { const d = isDone(i + 1);
    return `<div class="fslot ${d ? 'on' : ''}" style="--c:${w.c}"><b>${d ? w.digit : '?'}</b><small>${d ? w.key : 'a descobrir'}</small></div>`; }).join('')}</div>`;
  let act;
  if (nk === 1) act = `<button class="btn" data-act="start" data-k="1">Começar missão 1 · ${fmtMin(TEMPO_ETAPA_SEG)}</button><p class="soft" style="font-size:13px;text-align:center">O cronômetro começa assim que você tocar.</p>`;
  else if (nk >= 2 && nk <= 4) act = codeForm(nk);
  else if (nk === 5) act = `<button class="btn" data-act="start" data-k="5">Abrir o cofre · ${fmtMin(TEMPO_ETAPA_SEG)}</button>`;
  else act = '<p class="ph-title" style="text-align:center">Você destravou o dia da Lia!</p>';
  const total = [1, 2, 3, 4].reduce((a, k) => a + starsOf(P.games[k]), 0);
  return `<div class="card glass"><p class="tag">Central de missões</p><h2>${fresh ? 'Você entrou!' : nk ? 'Continue a jornada' : 'Missão cumprida'}</h2>
      ${fresh ? '<p class="story">O assistente da cidade da Lia travou e o dia dela ficou bloqueado. Cada missão libera uma <b>palavra</b> e um <b>número</b>. Juntos, eles formam o código de 4 dígitos. Preste atenção nas falas: elas trazem as respostas.</p>' : ''}
      ${frags}<ol class="nodes">${nodes}</ol>${act}
      <p class="soft" style="font-size:13px;text-align:center">${A('star')} ${total} de ${MAX_STARS} fases resolvidas de primeira</p></div>
    <button class="btn-ghost" data-act="reset">Recomeçar do zero neste celular</button>`;
}
function resultHTML(k){
  const s = st(k), g = P.games[k] || initGame(k), M = MISSIONS[k];
  const ack = '<button class="btn" data-act="ack">Voltar à central de missões</button>';
  if (k === 5) {
    const seq = WORDS.map(w => `<span class="word" style="--c:${w.c}">${w.key} ${w.digit}</span>`).join(' ');
    return `<div class="fragcard pop" style="--c:var(--mag)"><span class="ask-char" style="width:70px;height:70px">${ASSIST}</span><p class="tag">${s.recovered ? 'Tempo esgotado: código revelado' : 'Sistema desbloqueado'}</p><span class="dig gradtext">2035</span>
      <p>${s.recovered ? '“O código era 2035, na ordem do dia da Lia.”' : '“Vocês descobriram: as pessoas dão propósito à tecnologia.”'}</p></div>
      <div class="card glass"><p class="tag">A ordem do dia da Lia</p><p style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${seq}</p>
      <p class="soft">Organizar, aprender, incluir e adaptar: o ano em que a Lia vive, 2035, destravou o dia dela. Olhe o telão!</p></div>${ack}`;
  }
  const w = WORDS[k - 1];
  return `<div class="card glass big-msg pop"><h2>${s.recovered ? 'Tempo esgotado' : 'Missão cumprida!'}</h2>
      <p>${s.recovered ? 'Sem problema: veja a solução abaixo. O fragmento foi recuperado.' : 'Você coletou o fragmento desta etapa.'}</p></div>
    <div class="fragcard pop" style="--c:${w.c}"><p class="tag">${s.recovered ? 'Fragmento recuperado' : 'Fragmento coletado'}</p><span class="dig">${w.digit}</span><span class="word" style="--c:${w.c}">${w.key}</span>
      <p class="soft">${M.clue}${s.recovered ? '' : ` · ${A('star')} ${starsOf(g)}/${starPhases(k)} de primeira`}</p></div>
    <div class="card glass"><p class="tag">O que aprendemos</p><p>${M.reveal}</p><p class="soft">Próxima parada: ${M.next}</p></div>${ack}`;
}
function view(){
  const pk = playingK();
  const body = P.result ? resultHTML(P.result) : pk ? `<div class="card glass">${gameHTML(P, pk)}</div>` : hubHTML();
  const fx = P.result && !st(P.result).recovered ? confetti(P.result === 5 ? 90 : 30, P.result * 3 + 1) : '';
  return `<main class="team">${fx}<header class="team-head"><span class="team-brand">${LOGO}Um dia no futuro</span>${timeline(stagePos(), doneCount())}</header>${body}</main>`;
}

/* ===================== RENDER E EVENTOS ===================== */
const app = document.getElementById('app');
let lastHtml = '';
function render(){
  const html = view();
  if (html !== lastHtml) { app.innerHTML = html; lastHtml = html; }
  paintTimer();
}
function paintTimer(){
  const k = playingK(), left = k ? Math.max(0, st(k).endsAt - Date.now()) : 0, sec = Math.ceil(left / 1000);
  const txt = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  document.querySelectorAll('[data-timer]').forEach(el => { el.textContent = k ? txt : ''; el.classList.toggle('low', !!k && sec <= 30); });
  const bar = document.querySelector('[data-bar]'); if (bar) bar.style.width = (k ? left / (TEMPO_ETAPA_SEG * 1000) * 100 : 0).toFixed(1) + '%';
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (/^m\d-/.test(act)) { gameAction(P, act, b); return; }
  if (act === 'start') startStage(Number(b.dataset.k));
  else if (act === 'ack') { P.result = null; save(); render(); window.scrollTo(0, 0); }
  else if (act === 'reset') { if (confirm('Apagar todo o seu progresso neste celular e recomeçar?')) resetAll(); }
});
app.addEventListener('submit', e => { if (e.target.dataset.form !== 'code') return; e.preventDefault(); P.draft = e.target.elements.cod.value; tentarCodigo(P.draft); });
app.addEventListener('input', e => { if (e.target.id === 'cod') P.draft = e.target.value; });

load();
render();
setInterval(tick, 250);

</script>
