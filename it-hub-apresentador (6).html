<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0C0E1A" />
    <title>IT Hub · Apresentador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===================== ESTILOS (identidade visual do IT Hub) ===================== */
      :root {
        --bg: #0c0e1a;
        --card: #151a2e;
        --card-2: #1c2240;
        --line: #2a2e48;
        --edge: rgba(255, 255, 255, 0.07);
        --ink: #f4f5fa;
        --soft: #9ca1bf;
        --cyan: #00e0fa;
        --vio: #7c4dff;
        --lav: #a98bff;
        --mag: #ff3ea5;
        --blue: #4f7cff;
        --amber: #ffb547;
        --lime: #3ddc97;
        --bad: #ff5c7a;
        --grad: linear-gradient(90deg, #7c4dff, #ff3ea5);
        --grad-tl: linear-gradient(90deg, #00e0fa, #7c4dff 60%, #ff3ea5);
        --focus: #00e0fa;
        --font: "Poppins", "Segoe UI", system-ui, sans-serif;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* O visual do IT Hub é escuro nos dois modos do sistema. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.45;
        background-color: var(--bg);
        background-image:
          radial-gradient(
            ellipse 80% 70% at 100% 0%,
            rgba(66, 33, 150, 0.6),
            transparent 62%
          ),
          linear-gradient(160deg, #0c0e1a 45%, #120e26);
        background-attachment: fixed;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3 {
        font-weight: 800;
        line-height: 1.08;
        margin: 0;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
      }
      .soft {
        color: var(--soft);
      }
      .neon {
        text-shadow: none;
      }
      .glass {
        background: var(--card);
        border: 1px solid var(--edge);
        border-radius: 14px;
      }
      .notice {
        background: var(--card-2);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--soft);
      }
      .icon {
        width: 1em;
        height: 1em;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .word {
        display: inline-block;
        padding: 5px 16px;
        border-radius: 999px;
        background: var(--c);
        color: #0c0e1a;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .kick {
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sc, var(--cyan));
      }
      .shakeA {
        animation: shakeA 0.45s;
      }
      .shakeB {
        animation: shakeB 0.45s;
      }
      @keyframes shakeA {
        20%,
        60% {
          transform: translateX(-9px);
        }
        40%,
        80% {
          transform: translateX(9px);
        }
      }
      @keyframes shakeB {
        20%,
        60% {
          transform: translateX(-9px);
        }
        40%,
        80% {
          transform: translateX(9px);
        }
      }
      @keyframes pop {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        60% {
          transform: scale(1.05);
          opacity: 1;
        }
        100% {
          transform: none;
        }
      }
      .pop {
        animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }

      /* Logo e Lia */
      .logo {
        display: block;
      }
      .lia-svg {
        width: 100%;
        height: 100%;
        display: block;
        animation: bob 1.1s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-4%);
        }
      }

      /* Linha do dia (rodapé dos slides e topo do celular) */
      .tl {
        --u: 1cqw;
        position: relative;
        height: calc(var(--u) * 9.4);
        margin: 0 0.4%;
      }
      .team .tl {
        --u: 5px;
        height: 62px;
      }
      .team .tl .lbl {
        font-size: 10.5px;
        top: 38px;
      }
      .tl .track,
      .tl .tlfill {
        position: absolute;
        top: calc(var(--u) * 6);
        left: 0;
        height: calc(var(--u) * 0.3);
        border-radius: 99px;
      }
      .tl .track {
        right: 0;
        background: var(--line);
      }
      .tl .tlfill {
        background: var(--grad-tl);
        transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .tl .dot {
        position: absolute;
        top: calc(var(--u) * 6.15);
        transform: translate(-50%, -50%);
        width: calc(var(--u) * 1.7);
        height: calc(var(--u) * 1.7);
        border-radius: 50%;
        background: #11142a;
        border: calc(var(--u) * 0.2) solid #3a3e5c;
      }
      .tl .dot.done {
        width: calc(var(--u) * 2.5);
        height: calc(var(--u) * 2.5);
        border: 0;
        background: linear-gradient(135deg, #00e0fa, #7c4dff);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: calc(var(--u) * 1.3);
        color: #fff;
      }
      .tl .dot.cur {
        border: calc(var(--u) * 0.34) solid var(--mag);
        width: calc(var(--u) * 1.9);
        height: calc(var(--u) * 1.9);
      }
      .tl .lbl {
        position: absolute;
        top: calc(var(--u) * 7.5);
        transform: translateX(-50%);
        font-size: calc(var(--u) * 1.45);
        color: var(--soft);
        white-space: nowrap;
      }
      .tl .lbl.cur {
        color: #fff;
        font-weight: 700;
      }
      .tl .star {
        position: absolute;
        top: calc(var(--u) * 6.15);
        transform: translate(-50%, -50%);
        width: calc(var(--u) * 2.3);
        height: calc(var(--u) * 2.3);
        color: var(--mag);
      }
      .tl .lia {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        width: calc(var(--u) * 3.8);
        height: calc(var(--u) * 6);
        transition: left 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ---------- Celular e jogos ---------- */
      .team {
        position: relative;
        overflow: hidden;
        max-width: 600px;
        margin: 0 auto;
        min-height: 100%;
        padding: 14px 14px 28px;
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .team-head {
        display: grid;
        gap: 4px;
      }
      .team-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 15px;
      }
      .team-brand svg {
        width: 26px;
        height: 22px;
      }
      .brand {
        font-weight: 700;
        font-size: 16px;
      }
      .card {
        padding: 16px;
        display: grid;
        gap: 12px;
      }
      .card h2 {
        font-size: 23px;
      }
      .tag {
        font-size: 12px;
        color: var(--soft);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .big-msg {
        text-align: center;
        display: grid;
        gap: 10px;
        justify-items: center;
        padding: 18px 8px;
      }
      .big-msg h2 {
        font-size: 26px;
      }
      .timer-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .tbadge {
        font-weight: 800;
        font-size: 22px;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
      }
      .steps-dots {
        display: flex;
        gap: 6px;
      }
      .steps-dots i {
        width: 26px;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }
      .steps-dots i.on {
        background: var(--grad);
      }
      .steps-dots i.done {
        background: var(--cyan);
      }
      .ph-title {
        font-weight: 700;
        font-size: 19px;
        line-height: 1.2;
      }
      .ph-hint {
        font-size: 14px;
        color: var(--soft);
      }
      .msg {
        font-size: 14px;
        color: var(--amber);
        min-height: 1.2em;
        text-align: center;
        font-weight: 500;
      }
      .count {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 60px;
        background: var(--grad);
      }
      .zoom {
        animation: zoom 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes zoom {
        0% {
          transform: scale(1.7);
          opacity: 0;
        }
        35% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: 0;
        background: var(--grad);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
      }
      .btn:disabled {
        opacity: 0.35;
      }
      .btn-ghost {
        background: none;
        border: 0;
        color: var(--soft);
        text-decoration: underline;
        padding: 4px 0;
        justify-self: center;
        font-size: 14px;
      }
      .fragcard {
        display: grid;
        gap: 8px;
        justify-items: center;
        padding: 20px;
        border-radius: 16px;
        background: var(--card);
        border: 2px solid var(--c);
      }
      .fragcard .dig {
        font-weight: 800;
        font-size: 64px;
        line-height: 1;
        color: var(--c);
      }
      .wave {
        display: flex;
        gap: 6px;
        align-items: center;
        height: 38px;
      }
      .wave i {
        width: 6px;
        border-radius: 3px;
        background: var(--grad);
        animation: wave 1.1s ease-in-out infinite;
      }
      .wave i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .wave i:nth-child(3) {
        animation-delay: 0.3s;
      }
      .wave i:nth-child(4) {
        animation-delay: 0.45s;
      }
      .wave i:nth-child(5) {
        animation-delay: 0.6s;
      }
      @keyframes wave {
        0%,
        100% {
          height: 10px;
        }
        50% {
          height: 36px;
        }
      }
      .dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--mag);
        animation: blink 1.2s infinite;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      .game {
        display: grid;
        gap: 12px;
      }

      /* M1 */
      .places {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px;
        border-radius: 14px;
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 22px,
            rgba(255, 255, 255, 0.04) 22px 24px
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0 22px,
            rgba(255, 255, 255, 0.04) 22px 24px
          ),
          var(--card);
      }
      .place {
        border: 2px solid var(--c);
        border-radius: 12px;
        padding: 14px 8px;
        background: color-mix(in srgb, var(--c) 14%, var(--card));
        font-weight: 600;
        display: grid;
        justify-items: center;
        gap: 4px;
        font-size: 14px;
      }
      .place .icon {
        font-size: 24px;
        color: var(--c);
      }
      .board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        padding: 8px;
        border-radius: 14px;
        background: var(--card);
      }
      .cell {
        aspect-ratio: 1;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #11142a;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 600;
        color: var(--soft);
        padding: 0;
        line-height: 1.1;
        text-align: center;
      }
      .cell.adj {
        border-color: var(--cyan);
      }
      .cell.block {
        background: repeating-linear-gradient(
          45deg,
          rgba(255, 92, 122, 0.55) 0 6px,
          #2a1020 6px 12px
        );
        border-color: var(--bad);
        color: #fff;
      }
      .cell.water {
        background: repeating-linear-gradient(
          0deg,
          rgba(79, 124, 255, 0.6) 0 5px,
          #141a40 5px 10px
        );
        border-color: var(--blue);
        color: #fff;
      }
      .cell.dest {
        border: 2px solid var(--mag);
        background: rgba(255, 62, 165, 0.2);
        color: #fff;
      }
      .cell.home {
        color: #fff;
      }
      .cell.trail {
        background: rgba(0, 224, 250, 0.14);
      }
      .lia-dot {
        width: 82%;
        height: 82%;
        display: block;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .item {
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: var(--card);
        padding: 12px 4px;
        display: grid;
        justify-items: center;
        gap: 4px;
        font-size: 13px;
      }
      .item .em {
        font-size: 28px;
        line-height: 1;
      }
      .item.got {
        border-color: var(--cyan);
        background: rgba(0, 224, 250, 0.12);
      }
      .item.no {
        opacity: 0.35;
        text-decoration: line-through;
      }
      /* M2 */
      .arena {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        padding: 8px;
        border-radius: 14px;
        background: var(--card);
        max-width: 290px;
        width: 100%;
        justify-self: center;
      }
      .acell {
        aspect-ratio: 1;
        border-radius: 8px;
        background: #11142a;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        position: relative;
      }
      .bat {
        width: 46%;
        height: 60%;
        border: 2px solid var(--lime);
        border-radius: 4px;
        background: linear-gradient(0deg, var(--lime) 60%, transparent 60%);
      }
      .robot {
        width: 74%;
        height: 74%;
        transition: transform 0.3s;
        color: var(--cyan);
      }
      .robot.crash {
        color: var(--bad);
      }
      .prog {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 44px;
        padding: 6px;
        border-radius: 12px;
        border: 1px dashed var(--line);
        background: #11142a;
        align-items: center;
      }
      .blk {
        border: 0;
        border-radius: 8px;
        padding: 6px 10px;
        font-weight: 700;
        font-size: 13px;
        color: #0c0e1a;
        background: var(--c);
      }
      .blk.now {
        outline: 3px solid #fff;
      }
      .palette {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .palette button {
        border: 0;
        border-radius: 12px;
        padding: 12px 4px;
        background: var(--c);
        color: #0c0e1a;
        font-weight: 700;
        font-size: 14px;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 8px;
      }
      /* M3 */
      .oldphone {
        border-radius: 24px;
        padding: 10px;
        background: var(--grad);
        max-width: 280px;
        width: 100%;
        justify-self: center;
      }
      .oldscreen {
        border-radius: 16px;
        background: #f3f2f8;
        color: #1b1440;
        padding: 14px;
        min-height: 150px;
        display: grid;
        gap: 8px;
        align-content: center;
        transition: background 0.3s;
      }
      .oldscreen.dim {
        background: #57566a;
      }
      .note {
        transition:
          font-size 0.3s,
          color 0.3s;
        font-size: 9px;
        color: #c7c6d2;
        line-height: 1.25;
        font-weight: 700;
      }
      .note.big {
        font-size: 20px;
      }
      .note.hc {
        color: #120a30;
      }
      .clutter {
        display: grid;
        gap: 3px;
      }
      .clutter i {
        display: block;
        height: 5px;
        border-radius: 2px;
        background: #b9b6d0;
      }
      .voice {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        color: #5a2dcf;
        font-weight: 700;
      }
      .grandpa {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }
      .face {
        font-size: 32px;
      }
      .tools {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .tools button {
        border: 1px solid var(--edge);
        border-radius: 12px;
        padding: 10px 4px;
        background: var(--card);
        font-size: 12px;
        line-height: 1.15;
        display: grid;
        justify-items: center;
        gap: 4px;
        min-height: 70px;
      }
      .tools button .icon {
        font-size: 22px;
        color: var(--mag);
      }
      .tools button[aria-pressed="true"] {
        border-color: var(--mag);
        background: rgba(255, 62, 165, 0.16);
      }
      .totem {
        border-radius: 16px;
        background: #e9e8f2;
        color: #1b1440;
        padding: 12px;
        display: grid;
        gap: 8px;
        max-width: 320px;
        width: 100%;
        justify-self: center;
        border: 3px solid #5a2dcf;
      }
      .spot {
        border: 2px dashed transparent;
        border-radius: 10px;
        background: transparent;
        padding: 6px;
        text-align: left;
        color: inherit;
      }
      .spot.found {
        border-color: var(--bad);
        background: rgba(255, 92, 122, 0.15);
      }
      .spot .light {
        color: #c9c8d4;
        font-weight: 700;
      }
      .vid {
        height: 70px;
        border-radius: 8px;
        background: #1b1440;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 22px;
      }
      .iconbtn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #5a2dcf;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      .buybtn {
        background: #5a2dcf;
        color: #fff;
        border-radius: 8px;
        padding: 8px 10px;
        font-weight: 700;
        text-align: center;
        display: block;
      }
      /* M4 */
      .chars {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .char {
        border: 2px solid var(--c);
        border-radius: 14px;
        padding: 10px 4px;
        background: color-mix(in srgb, var(--c) 12%, var(--card));
        display: grid;
        justify-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 700;
      }
      .char .icon {
        font-size: 28px;
        color: var(--c);
      }
      .char[aria-pressed="true"] {
        background: color-mix(in srgb, var(--c) 35%, var(--card));
        transform: translateY(-3px);
      }
      .char.used {
        opacity: 0.3;
      }
      .stations {
        display: grid;
        gap: 8px;
      }
      .station {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid var(--edge);
        border-radius: 12px;
        padding: 12px;
        background: var(--card);
        text-align: left;
        font-weight: 600;
      }
      .station .slot {
        min-width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px dashed var(--line);
        display: grid;
        place-items: center;
      }
      .station .slot .icon {
        font-size: 24px;
      }
      .station.filled {
        border-color: var(--cyan);
      }
      .alert {
        border-radius: 14px;
        padding: 12px;
        background: var(--grad);
        text-align: center;
        font-weight: 700;
        animation: pulse 1s infinite alternate;
      }
      @keyframes pulse {
        to {
          opacity: 0.8;
        }
      }
      .choices {
        display: grid;
        gap: 8px;
      }
      .choices button {
        border: 1px solid var(--edge);
        border-radius: 12px;
        padding: 14px;
        background: var(--card);
        text-align: left;
        font-weight: 600;
      }
      /* M5 */
      .vault {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 12px;
        border-radius: 18px;
        background: var(--card);
        border: 2px solid var(--line);
      }
      .wheel {
        aspect-ratio: 0.8;
        border-radius: 12px;
        border: 2px solid var(--c);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 34px;
        color: var(--c);
        background: #11142a;
      }
      .wheel.empty {
        border-style: dashed;
        color: rgba(255, 255, 255, 0.25);
      }
      .vault.open {
        border-color: var(--mag);
      }
      .inv {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .inv button {
        border: 2px solid var(--c);
        border-radius: 12px;
        padding: 10px 6px;
        background: var(--card);
        display: grid;
        justify-items: center;
        gap: 2px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--c);
        font-size: 13px;
      }
      .inv button b {
        font-size: 26px;
        color: #fff;
      }
      .inv button.used {
        opacity: 0.25;
      }

      /* ---------- Slides (estilo IT Hub) ---------- */
      .wrap {
        container-type: inline-size;
        width: 100%;
      }
      .slide {
        position: relative;
        overflow: hidden;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 1.4cqw;
        padding: 4.4cqw 6.6cqw 1.6cqw;
        font-size: max(11px, 1.75cqw);
        background:
          radial-gradient(
            ellipse 75% 85% at 100% 0%,
            rgba(66, 33, 150, 0.65),
            transparent 62%
          ),
          linear-gradient(160deg, #0c0e1a 45%, #110d24);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 2cqw;
        position: relative;
        z-index: 1;
      }
      .slide .kick {
        font-size: 1.35cqw;
        display: flex;
        gap: 1cqw;
        align-items: center;
        flex-wrap: wrap;
      }
      .top-r {
        display: flex;
        gap: 1cqw;
        align-items: center;
      }
      .logo-s {
        width: 5.2cqw;
        height: auto;
      }
      .sndbtn {
        border: 1px solid var(--edge);
        background: var(--card);
        border-radius: 99px;
        padding: 0.3cqw 1cqw;
        font-size: 1.1cqw;
        color: var(--soft);
      }
      .main {
        position: relative;
        z-index: 1;
        display: grid;
        align-content: start;
        gap: 1.4cqw;
        min-height: 0;
      }
      .slide h1 {
        font-size: 5.4cqw;
      }
      .slide h2 {
        font-size: 3.6cqw;
        font-weight: 700;
      }
      .pista-tag {
        display: inline-flex;
        align-items: center;
        background: var(--amber);
        color: #1a1200;
        border-radius: 99px;
        padding: 0.2cqw 1cqw;
        font-size: 1.1cqw;
        letter-spacing: 0.08em;
      }
      .scenebox {
        background: var(--card);
        border: 1px solid var(--edge);
        border-radius: 1cqw;
        padding: 2cqw 2.2cqw;
        max-width: 62cqw;
      }
      .scenebox .kick {
        font-size: 1.3cqw;
        margin-bottom: 0.8cqw;
      }
      .scenebox p {
        font-size: 2.25cqw;
        line-height: 1.4;
      }
      .cards4 {
        display: grid;
        grid-template-columns: repeat(var(--n), 1fr);
        gap: 1.4cqw;
      }
      .cards4 > div {
        background: var(--card);
        border: 1px solid var(--edge);
        border-radius: 1cqw;
        padding: 2cqw 1.7cqw;
        min-height: 11.5cqw;
        display: grid;
        align-content: start;
        gap: 1.5cqw;
      }
      .cards4 .icon {
        font-size: 2.5cqw;
        color: var(--sc);
      }
      .cards4 b {
        font-weight: 600;
        font-size: 1.85cqw;
        line-height: 1.22;
      }
      .cards4 small {
        font-size: 1.3cqw;
        color: var(--soft);
        line-height: 1.35;
      }
      .cards4.pista > div {
        border-color: var(--amber);
      }
      .cards4.pista .icon {
        color: var(--amber);
      }
      .banner {
        background: var(--grad);
        border-radius: 1cqw;
        padding: 1.6cqw 2.2cqw;
        font-weight: 600;
        font-size: 2cqw;
        line-height: 1.35;
      }
      .cover {
        display: grid;
        gap: 1.2cqw;
        align-content: center;
      }
      .cover-logo {
        display: flex;
        align-items: flex-end;
        gap: 1.6cqw;
        margin-bottom: 1.4cqw;
      }
      .cover-logo svg {
        width: 8.4cqw;
        height: auto;
      }
      .cover-logo b {
        font-size: 3.4cqw;
        font-weight: 800;
        letter-spacing: 0.06em;
        line-height: 1;
      }
      .cover h1 {
        font-size: 5.6cqw;
        max-width: 20ch;
      }
      .cover .tsub {
        font-size: 2.9cqw;
        font-weight: 700;
        color: var(--cyan);
      }
      .cover .tline {
        font-size: 1.9cqw;
        color: var(--soft);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 1cqw;
        margin-top: 1.4cqw;
      }
      .pills span {
        border-radius: 99px;
        padding: 0.6cqw 1.9cqw;
        font-weight: 700;
        font-size: 1.55cqw;
        background: var(--c);
        color: var(--t, #0c0e1a);
      }
      .two {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 3cqw;
        align-items: start;
      }
      .lockcard {
        display: flex;
        gap: 2cqw;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--mag);
        border-radius: 1cqw;
        padding: 2cqw 2.4cqw;
        max-width: 62cqw;
      }
      .lockcard .icon {
        font-size: 5cqw;
        color: var(--mag);
        animation: blink 1.6s infinite;
      }
      .lockcard b {
        font-size: 2.4cqw;
        letter-spacing: 0.06em;
      }
      .qr {
        background: #fff;
        padding: 1.2cqw;
        border-radius: 1.2cqw;
        display: grid;
        gap: 0.8cqw;
        justify-items: center;
        justify-self: end;
      }
      .qr p {
        color: #1b1440;
        font-size: 1.05cqw;
        word-break: break-all;
        max-width: 20cqw;
        text-align: center;
      }
      #qr img,
      #qr canvas {
        width: 20cqw !important;
        height: 20cqw !important;
        display: block;
      }
      .qr-ph {
        width: 20cqw;
        height: 20cqw;
        display: grid;
        place-items: center;
        text-align: center;
        color: #4b4380;
        font-size: 1.25cqw;
        border: 0.2cqw dashed #b7b0e8;
        border-radius: 1cqw;
        padding: 1.4cqw;
      }
      .mlist {
        display: grid;
        gap: 1cqw;
      }
      .mrow {
        display: grid;
        grid-template-columns: 3cqw minmax(0, 1fr) 7cqw;
        gap: 1.2cqw;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--edge);
        border-radius: 1cqw;
        padding: 1.1cqw 1.4cqw;
      }
      .mrow .n {
        font-weight: 800;
        font-size: 2.2cqw;
        color: var(--sc);
      }
      .mrow .track {
        height: 1cqw;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
        margin-top: 0.5cqw;
      }
      .mrow .fill {
        height: 100%;
        background: var(--grad-tl);
        transition: width 0.6s ease;
      }
      .mrow b {
        font-size: 1.9cqw;
        text-align: right;
      }
      .ring {
        width: 12cqw;
        height: 12cqw;
        position: relative;
        display: grid;
        place-items: center;
      }
      .ring svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .ring circle {
        fill: none;
        stroke-width: 7;
      }
      .ring .bg {
        stroke: var(--line);
      }
      .ring .fg {
        stroke: var(--cyan);
        stroke-linecap: round;
        transition:
          stroke-dashoffset 0.25s linear,
          stroke 0.3s;
      }
      .ring.low .fg {
        stroke: var(--mag);
      }
      .ring.low span {
        animation: beat 0.5s infinite alternate;
      }
      .ring span {
        font-weight: 800;
        font-size: 4.2cqw;
        font-variant-numeric: tabular-nums;
      }
      @keyframes beat {
        to {
          transform: scale(1.12);
        }
      }
      .count-big {
        width: 18cqw;
        height: 18cqw;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 10cqw;
        background: var(--grad);
        justify-self: center;
      }
      .big-num {
        font-weight: 800;
        font-size: 4.2cqw;
        line-height: 1;
      }
      .slide .fragcard {
        padding: 2.4cqw 3cqw;
        border-radius: 1.4cqw;
        gap: 1cqw;
        border-width: 0.25cqw;
      }
      .slide .fragcard .dig {
        font-size: 11cqw;
      }
      .slide .fragcard .word {
        font-size: 2.2cqw;
        padding: 0.5cqw 1.8cqw;
      }
      .slide .fragcard .soft {
        font-size: 1.5cqw;
      }
      .code {
        display: flex;
        gap: 1.4cqw;
      }
      .code span {
        width: 10cqw;
        height: 12cqw;
        border-radius: 1.2cqw;
        background: var(--card);
        border: 0.25cqw solid var(--c);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 7.4cqw;
        color: var(--c);
        animation: pop 0.6s both;
      }
      .gradtext {
        background: var(--grad-tl);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .slide .game {
        width: min(440px, 34cqw);
        zoom: 1.45;
      }
      .idle-hint {
        display: flex;
        gap: 1cqw;
        align-items: center;
        color: var(--amber);
        font-weight: 600;
        font-size: 1.5cqw;
      }
      .idle-hint i {
        width: 1cqw;
        height: 1cqw;
        border-radius: 50%;
        background: var(--amber);
        animation: blink 1.2s infinite;
      }

      /* Efeitos */
      .confetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 5;
      }
      .confetti i {
        position: absolute;
        top: -4%;
        width: var(--w);
        height: var(--h);
        background: var(--c);
        border-radius: 2px;
        opacity: 0;
        animation: fall var(--d) var(--dl) cubic-bezier(0.25, 0.6, 0.4, 1)
          forwards;
      }
      @keyframes fall {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0) rotate(0);
        }
        100% {
          opacity: 1;
          transform: translate3d(var(--x), 110vh, 0) rotate(var(--r));
        }
      }
      .flash {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: grid;
        place-items: center;
        background: var(--grad);
        font-weight: 800;
        font-size: 9cqw;
        pointer-events: none;
        animation: flash 1.3s forwards;
      }
      .flash.calm {
        background: #151a2e;
        font-size: 5cqw;
      }
      @keyframes flash {
        0% {
          opacity: 1;
          transform: scale(1.1);
        }
        55% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* ---------- Controle ---------- */
      .ctrl {
        max-width: 900px;
        margin: 0 auto;
        padding: 12px 12px 40px;
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .ctrl-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pill-s {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 99px;
        border: 1px solid var(--edge);
        background: var(--card);
        color: var(--soft);
      }
      .now {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: end;
      }
      .now .t {
        font-weight: 800;
        font-size: 38px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--cyan);
      }
      .row-btn {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .btn-sec {
        padding: 10px;
        border-radius: 12px;
        border: 1px solid var(--edge);
        background: var(--card-2);
        font-weight: 600;
        font-size: 13px;
        text-align: center;
        text-decoration: none;
        color: var(--ink);
      }
      .btn-sec.danger {
        color: var(--bad);
      }
      .fala {
        font-size: 14px;
        line-height: 1.5;
        border-left: 3px solid var(--mag);
        padding-left: 12px;
      }
      .list {
        display: grid;
        gap: 3px;
        max-height: 280px;
        overflow: auto;
        padding-right: 4px;
      }
      .list button {
        display: flex;
        gap: 8px;
        align-items: center;
        text-align: left;
        border: 1px solid transparent;
        background: none;
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 13px;
        color: var(--soft);
      }
      .list button[aria-current="step"] {
        border-color: var(--cyan);
        color: #fff;
        background: rgba(0, 224, 250, 0.08);
      }
      .list .n {
        width: 24px;
        color: var(--cyan);
        font-weight: 700;
      }
      .list .tg {
        margin-left: auto;
        font-size: 11px;
        color: var(--amber);
      }
      .live-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px;
        gap: 8px;
        align-items: center;
        font-size: 13px;
      }
      .live-row .track {
        height: 8px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 3px;
      }
      .live-row .track i {
        display: block;
        height: 100%;
        background: var(--grad-tl);
      }

      /* ---------- Simulação e offline ---------- */
      .sim {
        padding: 16px;
        display: grid;
        gap: 16px;
        max-width: 1500px;
        margin: 0 auto;
      }
      .sim-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .sim-head p {
        font-size: 13px;
        max-width: 74ch;
        color: var(--soft);
      }
      .sim-top {
        display: grid;
        grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .lbl {
        font-size: 12px;
        color: var(--soft);
        margin: 0 0 6px;
      }
      .frame {
        border: 1px solid var(--edge);
        border-radius: 14px;
        overflow: hidden;
      }
      .frame .slide {
        min-height: 0;
        aspect-ratio: 16/9;
      }
      .phones {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 16px;
      }
      .phone {
        border: 6px solid #1c2240;
        border-radius: 30px;
        height: 700px;
        overflow: auto;
        background: linear-gradient(170deg, #140f2e, #0c0e1a 40%);
        font-size: 15px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tabs a {
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 99px;
        border: 1px solid var(--edge);
        text-decoration: none;
        background: var(--card);
      }
      .offline {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: 1fr auto;
      }
      .offline .wrap {
        display: grid;
      }
      .offline .slide {
        min-height: 0;
      }
      .offline-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-top: 1px solid var(--edge);
        background: #0c0e1a;
        font-size: 13px;
        color: var(--soft);
      }
      .offline-nav div {
        display: flex;
        gap: 8px;
      }
      .offline-nav button {
        border: 1px solid var(--edge);
        background: var(--card);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 600;
        color: #fff;
      }

      @media (max-width: 900px) {
        .sim-top {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flash,
        .confetti {
          display: none;
        }
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      /* ---------- Missões: HUD, personagens e desafio tech ---------- */
      .shape {
        width: 1em;
        height: 1em;
        flex: none;
        fill: #fff;
      }
      .logo-img {
        display: block;
        width: 100%;
        height: auto;
      }
      .hud {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hud-m {
        background: var(--grad);
        border-radius: 8px;
        padding: 2px 8px;
        font-weight: 800;
        font-size: 13px;
      }
      .hud .steps-dots {
        flex: 1;
      }
      .hud-stars {
        font-weight: 700;
        font-size: 13px;
        color: var(--amber);
      }
      .ph-kicker {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--cyan);
      }
      .ask {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .ask-char {
        width: 54px;
        height: 80px;
        flex: none;
      }
      .ask-char svg {
        width: 100%;
        height: 100%;
      }
      .bubble {
        position: relative;
        background: #fff;
        color: #0c0e1a;
        border-radius: 14px 14px 14px 4px;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 15px;
        line-height: 1.3;
      }
      .qtiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .qtile {
        display: flex;
        gap: 8px;
        align-items: center;
        border: 0;
        border-radius: 12px;
        padding: 16px 12px;
        min-height: 72px;
        background: var(--c);
        color: #0c0e1a;
        font-weight: 700;
        font-size: 15px;
        text-align: left;
        box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.2);
      }
      .qtile .shape {
        fill: #0c0e1a;
        font-size: 18px;
      }
      .qtile.no {
        opacity: 0.25;
        text-decoration: line-through;
      }
      .qtile:active {
        transform: translateY(2px);
      }
      .place .pe {
        font-size: 30px;
        line-height: 1;
      }
      .cell .ce {
        font-size: 20px;
        line-height: 1;
      }
      .cell .deco {
        font-size: 13px;
        opacity: 0.55;
      }
      .cell.block {
        background: rgba(255, 92, 122, 0.16);
        border-color: rgba(255, 92, 122, 0.6);
      }
      .robot {
        width: 80%;
        height: 80%;
        transition: transform 0.3s;
        display: grid;
      }
      .robot svg {
        width: 100%;
        height: 100%;
      }
      .robot.crash {
        filter: drop-shadow(0 0 6px var(--bad)) saturate(0.3);
      }
      .scene3 {
        display: grid;
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 8px;
        align-items: end;
      }
      .antonio {
        width: 80px;
        height: 114px;
      }
      .antonio svg {
        width: 100%;
        height: 100%;
      }
      .say {
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        color: var(--lav);
      }
      .totem-h {
        font-weight: 700;
        font-size: 13px;
        color: #5a2dcf;
      }
      .chars .char {
        gap: 2px;
        padding: 8px 4px;
      }
      .av {
        width: 44px;
        height: 58px;
        display: block;
      }
      .av svg {
        width: 100%;
        height: 100%;

    <script>
      /* ===================== CONFIGURAÇÃO (edite aqui) ===================== */
      // 1) Depois de publicar o app dos participantes no GitHub Pages, cole o endereço completo aqui.
      //    Exemplo de formato: "https://SEU-USUARIO.github.io/NOME-DO-REPOSITORIO/it-hub-participante.html"
      //    Enquanto estiver vazio, o slide do QR Code mostra um aviso de configuração.
      const LINK_APP_PARTICIPANTE = "";

      // 2) Códigos exibidos no telão. Devem ser IGUAIS aos do arquivo it-hub-participante.html.
      const CODIGOS_ETAPAS = {
        bruna: "ROTA", // libera a missão 1
        laura: "BYTE", // libera a missão 2
        julia: "ACESSO", // libera a missão 3
        carlos: "EQUIPE", // libera a missão 4
      };
      const TEMPO_ETAPA_SEG = 240; // 4 minutos por missão
      const STORAGE_KEY = "ithub-apresentador-v1"; // guarda só o slide atual e os cronômetros
      const CODIGO_DA_ETAPA = {
        1: CODIGOS_ETAPAS.bruna,
        2: CODIGOS_ETAPAS.laura,
        3: CODIGOS_ETAPAS.julia,
        4: CODIGOS_ETAPAS.carlos,
      };
      const fmtMin = (sec) =>
        sec % 60
          ? `${Math.floor(sec / 60)} min ${sec % 60} s`
          : `${sec / 60} min`;

      /* ===== Gerador de QR Code local (sem dependências) =====
   Modo byte (UTF-8), correção de erro nível M, versões 1 a 10 (até 213 caracteres).
   gerarQR(texto) -> matriz de booleanos | qrSvg(texto) -> string SVG */
      const QR = (() => {
        // [ecc por bloco, [nº blocos, dados por bloco], [nº blocos, dados por bloco]]
        const EC_M = [
          null,
          [10, [1, 16]],
          [16, [1, 28]],
          [26, [1, 44]],
          [18, [2, 32]],
          [24, [2, 43]],
          [16, [4, 27]],
          [18, [4, 31]],
          [22, [2, 38], [2, 39]],
          [22, [3, 36], [2, 37]],
          [26, [4, 43], [1, 44]],
        ];
        const ALIGN = [
          null,
          [],
          [6, 18],
          [6, 22],
          [6, 26],
          [6, 30],
          [6, 34],
          [6, 22, 38],
          [6, 24, 42],
          [6, 26, 46],
          [6, 28, 50],
        ];
        const EXP = new Array(512),
          LOG = new Array(256);
        for (let i = 0, x = 1; i < 255; i++) {
          EXP[i] = x;
          LOG[x] = i;
          x <<= 1;
          if (x & 256) x ^= 0x11d;
        }
        for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
        const mul = (a, b) => (a && b ? EXP[LOG[a] + LOG[b]] : 0);
        function rsGen(n) {
          let p = [1];
          for (let i = 0; i < n; i++) {
            const q = new Array(p.length + 1).fill(0);
            p.forEach((c, j) => {
              q[j] ^= c;
              q[j + 1] ^= mul(c, EXP[i]);
            });
            p = q;
          }
          return p;
        }
        function rsEc(data, n) {
          const g = rsGen(n),
            r = new Array(n).fill(0);
          data.forEach((d) => {
            const f = d ^ r.shift();
            r.push(0);
            if (f)
              g.slice(1).forEach((c, i) => {
                r[i] ^= mul(c, f);
              });
          });
          return r;
        }
        const bit = (v, i) => ((v >>> i) & 1) === 1;

        function gerar(texto) {
          const bytes = Array.from(new TextEncoder().encode(texto));
          let ver = 0,
            cap = 0;
          for (let v = 1; v <= 10; v++) {
            const [ec, ...gs] = EC_M[v];
            cap = gs.reduce((a, [n, d]) => a + n * d, 0);
            if (bytes.length + 1 + (v < 10 ? 1 : 2) <= cap) {
              ver = v;
              break;
            }
          }
          if (!ver)
            throw new Error(
              "Link longo demais para o QR Code embutido (máx. ~210 caracteres).",
            );
          const [ecLen, ...groups] = EC_M[ver],
            size = 17 + 4 * ver;
          // 1) fluxo de bits: modo byte + tamanho + dados + terminador + preenchimento
          const bits = [];
          const push = (v, n) => {
            for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1);
          };
          push(4, 4);
          push(bytes.length, ver < 10 ? 8 : 16);
          bytes.forEach((b) => push(b, 8));
          push(0, Math.min(4, cap * 8 - bits.length));
          while (bits.length % 8) bits.push(0);
          const data = [];
          for (let i = 0; i < bits.length; i += 8)
            data.push(parseInt(bits.slice(i, i + 8).join(""), 2));
          for (let p = 0xec; data.length < cap; p ^= 0xec ^ 0x11) data.push(p);
          // 2) blocos + Reed-Solomon + intercalação
          const blocks = [];
          let pos = 0;
          groups.forEach(([n, d]) => {
            for (let i = 0; i < n; i++) {
              const b = data.slice(pos, pos + d);
              pos += d;
              blocks.push({ d: b, e: rsEc(b, ecLen) });
            }
          });
          const out = [],
            maxD = Math.max(...blocks.map((b) => b.d.length));
          for (let i = 0; i < maxD; i++)
            blocks.forEach((b) => {
              if (i < b.d.length) out.push(b.d[i]);
            });
          for (let i = 0; i < ecLen; i++)
            blocks.forEach((b) => out.push(b.e[i]));
          // 3) matriz
          const M = Array.from({ length: size }, () =>
              new Array(size).fill(false),
            ),
            F = Array.from({ length: size }, () => new Array(size).fill(false));
          const setF = (x, y, v) => {
            M[y][x] = v;
            F[y][x] = true;
          };
          for (let i = 0; i < size; i++) {
            setF(6, i, i % 2 === 0);
            setF(i, 6, i % 2 === 0);
          }
          [
            [3, 3],
            [size - 4, 3],
            [3, size - 4],
          ].forEach(([cx, cy]) => {
            for (let dy = -4; dy <= 4; dy++)
              for (let dx = -4; dx <= 4; dx++) {
                const x = cx + dx,
                  y = cy + dy;
                if (x >= 0 && y >= 0 && x < size && y < size)
                  setF(
                    x,
                    y,
                    Math.max(Math.abs(dx), Math.abs(dy)) !== 2 &&
                      Math.max(Math.abs(dx), Math.abs(dy)) !== 4,
                  );
              }
          });
          const al = ALIGN[ver],
            last = al.length - 1;
          al.forEach((cy, i) =>
            al.forEach((cx, j) => {
              if (
                (i === 0 && j === 0) ||
                (i === 0 && j === last) ||
                (i === last && j === 0)
              )
                return;
              for (let dy = -2; dy <= 2; dy++)

          main = `<h1>O dia da Lia travou</h1>
      <div class="scenebox"><p class="kick" style="--sc:var(--cyan)">Cena da Lia</p><p>Ela vive numa cidade conectada. Hoje de manhã, o assistente da cidade travou depois de uma atualização, e o dia inteiro dela ficou bloqueado.</p></div>
      <div class="lockcard">${I.lock}<div><b>SISTEMA TRAVADO</b><p class="soft" style="font-size:1.7cqw">Insira o código de 4 dígitos para continuar.</p></div></div>`;
        } else if (sl.t === "join") {
          kicker = "Como jogar";
          main = `<h2>Vocês vão destravar o dia da Lia</h2>
      <div class="two" style="grid-template-columns:minmax(0,1.5fr) auto"><div style="display:grid;gap:1.4cqw">
        ${cardsHTML(
          [
            ["people", "Individual", "Cada um joga no seu celular"],
            ["map", "Escaneie o QR Code", "Abre o app no navegador"],
            ["eye", "Sem cadastro", "Ninguém precisa de nome ou login"],
            [
              "clock",
              `${fmtMin(TEMPO_ETAPA_SEG)} por missão`,
              "Fases de toque e um desafio tech",
            ],
          ],
          false,
        )}
        <div class="banner">A resposta do desafio tech está no que a gente fala. Em cada missão, o código de acesso aparece aqui no telão.</div></div>
        ${qrBlock()}</div>`;
        } else if (sl.t === "talk") {
          const tk = TALKS[sl.k],
            s = tk.slides[sl.i];
          kicker = `Etapa ${sl.k} · ${tk.who} · Mini palestra ${pista}`;
          main =
            s.type === "scene"
              ? `<h1 style="max-width:16ch">${s.title}</h1><div class="scenebox"><p class="kick">Cena da Lia</p><p>${s.scene}</p></div>`
              : `<h2>${s.title}</h2>${cardsHTML(s.cards, s.pista)}<div class="banner">${s.banner}</div>`;
        } else if (sl.t === "mission") {
          const k = sl.k,
            M = MISSIONS[k],
            T = tm(k),
            code = CODIGO_DA_ETAPA[k];
          kicker = k === 5 ? "Missão final" : `Etapa ${k} · Missão ${k}`;
          const status = {
            idle: "Pronto para iniciar",
            running: "Em andamento",
            paused: "Pausado",
            done: T.reason === "manual" ? "Encerrado" : "Tempo esgotado",
          }[T.status];
          const codeCard = code
            ? `<div class="codecard"><p class="kick" style="--sc:var(--mag)">Código da etapa ${k}</p><b class="codeword">${code}</b><p class="soft">Digite no app do celular</p></div>`
            : `<div class="codecard"><p class="kick" style="--sc:var(--cyan)">Sem código</p><p>O cofre abre ao concluir a missão 4.</p></div>`;
          main = `<h2>${M.name}</h2><div class="two" style="align-items:center"><div style="display:grid;gap:1.4cqw">
        <div class="scenebox" style="display:flex;gap:2cqw;align-items:center"><span class="mission-art">${missionArt(k)}</span><div><p class="kick">Missão</p><p>${M.intro}</p></div></div>
        <div class="pills ${M.phases.length > 4 ? 'many' : ''}" style="margin-top:0">${M.phases.map((p, i) => `<span style="--c:${PHASE_C[i % 4]}">${i + 1} · ${p}</span>`).join("")}</div></div>
      <div class="tcol">${ringHTML()}<p class="tstat">${status}</p>${codeCard}</div></div>`;
          if (T.status === "done")
            fx = `<div class="flash ${T.reason === "manual" ? "calm" : ""}" aria-hidden="true">${T.reason === "manual" ? "Missão encerrada" : "Tempo!"}</div>`;
        } else if (sl.t === "reveal") {
          const w = WORDS[sl.k - 1],
            M = MISSIONS[sl.k];
          kicker = `Etapa ${sl.k} · Fragmento liberado`;
          main = `<h2>${M.name}</h2><div class="two" style="grid-template-columns:auto minmax(0,1fr);align-items:center">
      <div class="fragcard" style="--c:${w.c}"><p class="kick" style="--sc:${w.c}">Fragmento ${sl.k}</p><span class="dig">${w.digit}</span><span class="word" style="--c:${w.c}">${w.key}</span><span class="soft">${M.clue}</span></div>
      <div style="display:grid;gap:1.4cqw"><div class="scenebox" style="max-width:none"><p class="kick">O que aprendemos</p><p>${M.reveal}</p></div><div class="banner">Próxima parada: ${M.next}</div></div></div>`;
          fx = confetti(60, sl.k * 7);
        } else if (sl.t === "unlocked") {
          kicker = "Missão final";
          main = `<h1>Sistema desbloqueado</h1><div class="code">${WORDS.map((w, i) => `<span style="--c:${w.c};animation-delay:${i * 0.25}s">${w.digit}</span>`).join("")}</div>
      <div class="pills" style="margin-top:0">${WORDS.map((w) => `<span style="--c:${w.c}">${w.key} ${w.digit}</span>`).join("")}</div>
      <div class="banner">O código era 2035: o ano em que a Lia vive, daqui a 9 anos. Organizar, aprender, incluir e adaptar destravou o dia dela.</div>`;
          fx = confetti(130, 99);
        } else if (sl.t === "human") {
          kicker = "O elemento que faltava";
          main = `<h1 style="font-size:4.4cqw">As pessoas.</h1><p style="font-size:1.9cqw;max-width:60ch">Mapa, aprendizagem, acessibilidade e trabalho em equipe só fazem sentido porque existe alguém do outro lado.</p>
      ${cast()}<div class="banner">Sistemas de Informação não é só desenvolver sistemas: é criar soluções que mudam a vida das pessoas.</div>`;
        } else if (sl.t === "statement") {
          kicker = "Futuro";
          main = `<h1 style="max-width:18ch;margin-top:3cqw">Um futuro melhor começa com tecnologias <span class="gradtext">pensadas para as pessoas.</span></h1>
      <p style="font-size:2.2cqw;color:var(--soft)">E quem vai construir as tecnologias de 2035 são vocês.</p>`;
        } else if (sl.t === "closing") {
          kicker = "Encerramento";
          main = `<h2>Quem constrói o futuro</h2>${cardsHTML(
            [
              [
                "git",
                "Projeto no GitHub",
                "Ideias que viram protótipos em equipe",
              ],
              ["grad", "O curso", "Oportunidades acadêmicas e profissionais"],
              ["chat", "Perguntas", "Agora é com vocês"],
            ],
            false,
          )}
      <div class="banner">Por trás de ferramentas que parecem simples há pessoas que identificam necessidades, desenham soluções, constroem, testam e melhoram.</div>`;
        }
        const top =
          sl.t === "cover"
            ? '<header class="top"><span></span><div class="top-r"></div></header>'
            : `<header class="top"><p class="kick">${kicker}</p><div class="top-r"><span class="logo-s">${LOGO}</span></div></header>`;
        return `<div class="wrap"><main class="slide" style="--sc:${sc}">${fx}${top}<section class="main" style="${sl.t === "cover" ? "align-content:center" : ""}">${main}</section>
    <footer style="position:relative;z-index:1">${timeline(pos, rev)}</footer></main></div>`;
      }

      /* ===================== BARRA DE CONTROLE ===================== */
      function barHTML() {
        const sl = slideOf();
        let timer = "";
        if (sl.t === "mission") {
          const T = tm(sl.k),
            b = (a, l, c = "") =>
              `<button class="${c}" data-act="t-${a}">${l}</button>`;
          const btns =
            T.status === "idle"
              ? b("start", "▶ Iniciar", "pri")
              : T.status === "running"
                ? b("pause", "❚❚ Pausar") +
                  b("end", "■ Encerrar") +
                  b("reset", "↺ Reiniciar")
                : T.status === "paused"
                  ? b("resume", "▶ Continuar", "pri") +
                    b("end", "■ Encerrar") +
                    b("reset", "↺ Reiniciar")
                  : b("reset", "↺ Reiniciar", "pri");
          timer = `<div class="grp"><span class="tt" data-timer></span>${btns}</div>`;
        }
        return `<footer class="bar"><div class="grp"><button data-act="prev" ${S.slide === 0 ? "disabled" : ""}>‹ Anterior</button>
      <select data-go aria-label="Ir para o slide">${DECK.map((d, i) => `<option value="${i}" ${i === S.slide ? "selected" : ""}>${i + 1}. ${d.name}</option>`).join("")}</select>
      <button data-act="next" ${S.slide === DECK.length - 1 ? "disabled" : ""}>Próximo ›</button></div>${timer}
    <div class="grp"><button data-act="notes" aria-pressed="${showNotes}">Falas (N)</button><button data-act="fs">Tela cheia (F)</button><button data-act="bar">Ocultar (H)</button></div></footer>`;
      }
      function view() {
        const sl = slideOf();
        const notes = showNotes
          ? `<section class="notes"><p class="tag">Fala deste slide${sl.pista ? ' · <b style="color:var(--amber)">tem pista</b>' : ""} · ${sl.name}</p><p class="fala">${sl.fala || ""}</p></section>`
          : "";
        return `<div class="pres"><div class="stagebox"><div class="stage">${slideHTML()}</div></div>${notes}${showBar ? barHTML() : '<button class="peek" data-act="bar" aria-label="Mostrar barra de controle">⋯</button>'}</div>`;
      }

      /* ===================== RENDER E EVENTOS ===================== */
      const app = document.getElementById("app");
      let lastHtml = "";
      function render() {
        const html = view();
        if (html !== lastHtml) {
          app.innerHTML = html;
          lastHtml = html;
        }
        paintTimer();
      }
      function paintTimer() {
        const sl = slideOf();
        if (sl.t !== "mission") return;
        const T = tm(sl.k),
          l = left(sl.k);
        document.querySelectorAll("[data-timer]").forEach((el) => {
          el.textContent = fmt(l);
        });
        document.querySelectorAll("[data-ring]").forEach((el) => {
          el.querySelector(".fg").style.strokeDashoffset = (
            276.5 *
            (1 - Math.min(1, l / TOTAL_MS))
          ).toFixed(1);
          el.classList.toggle(
            "low",
            T.status === "done" || (T.status === "running" && l <= 30000),
          );
        });
      }
      function goTo(i) {
        S.slide = Math.max(0, Math.min(DECK.length - 1, i));
        save();
        render();
      }
      function toggleFs() {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen)
          document.documentElement.requestFullscreen();
      }
      function toggleTimer() {
        const sl = slideOf();
        if (sl.t !== "mission") return;
        const T = tm(sl.k);
        timerAct(
          T.status === "running"
            ? "pause"
            : T.status === "idle"
              ? "start"
              : T.status === "paused"
                ? "resume"
                : "reset",
        );
      }
      function act(a) {
        if (a === "next") goTo(S.slide + 1);
        else if (a === "prev") goTo(S.slide - 1);
        else if (a === "notes") {
          showNotes = !showNotes;
          render();
        } else if (a === "bar") {
          showBar = !showBar;
          render();
        } else if (a === "fs") toggleFs();
        else if (a.startsWith("t-")) timerAct(a.slice(2));
      }
      app.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b || b.disabled) return;
        b.blur();
        act(b.dataset.act);
      });
      app.addEventListener("change", (e) => {
        if (e.target.hasAttribute("data-go")) {
          goTo(Number(e.target.value));
          e.target.blur();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          e.target.matches("select,input,textarea") ||
          e.ctrlKey ||
          e.metaKey ||
          e.altKey
        )
          return;
        const k = e.key;
        if (["ArrowRight", "PageDown", " "].includes(k)) {
          e.preventDefault();
          goTo(S.slide + 1);
        } else if (["ArrowLeft", "PageUp"].includes(k)) {
          e.preventDefault();
          goTo(S.slide - 1);
        } else if (k === "Home") goTo(0);
        else if (k === "End") goTo(DECK.length - 1);
        else if (k === "f" || k === "F") toggleFs();
        else if (k === "n" || k === "N") act("notes");
        else if (k === "h" || k === "H") act("bar");
        else if (k === "t" || k === "T") toggleTimer();
      });
      /* Relógio: encerra sozinho o cronômetro que chegou a zero. */
      setInterval(() => {
        let changed = false;
        Object.keys(S.timers).forEach((k) => {
          const T = S.timers[k];
          if (T.status === "running" && Date.now() >= T.endsAt) {
            T.status = "done";
            T.remaining = 0;
            T.reason = "time";
            changed = true;
          }
        });
        if (changed) save();
        render();
      }, 250);

      load();
      render();
    </script>
  </body>
</html>
